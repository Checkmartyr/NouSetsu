[package]
name = "nousetsu-desktop"
version = "0.5.3"
description = "Nousetsu Literary Novel Translation Studio"
authors = ["Nousetsu Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# GTK 0.18 cannot use glib 0.20. Keep its API and backport the upstream fix.
# See vendor/glib/SECURITY-PATCH.md before updating or removing this override.
[patch.crates-io]
glib = { path = "vendor/glib" }
