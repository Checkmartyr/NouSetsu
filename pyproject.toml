[project]
name = "nousetsu"
version = "0.1.0"
description = "NouSetsu - Agentic Document-Level Cross-Chapter Novel Translation System"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=1.0.0",
    "natsort>=8.4.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "textual>=0.70.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
