[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nousetsu"
version = "0.5.2"
description = "NouSetsu - Agentic Document-Level Cross-Chapter Novel Translation System"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Checkmartyr" }
]
keywords = ["translation", "novel", "llm", "agent", "light-novel", "textual", "tui", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "deep-translator>=1.11.4",
    "fastapi>=0.115.0",
    "langchain>=1.4.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "natsort>=8.4.0",
    "pydantic>=2.0.0",
    "pymupdf>=1.24.0",
    "pythainlp>=5.0.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "sqlalchemy>=2.0.0",
    "textual>=0.70.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
desktop-build = [
    "pyinstaller>=6.10",
    "aiofiles>=24.1.0",
    "anyascii>=0.3.3",
    "beautifulsoup4>=4.12.3",
    "cryptography>=42.0.0",
    "google-genai>=0.1.1",
    "httpx>=0.27.0",
    "lxml>=5.2.0",
    "playwright>=1.45.0",
    "pykakasi>=2.3.0",
]

[project.scripts]
nousetsu = "nousetsu.cli.app:main"
novel = "nousetsu.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nousetsu"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["modules", "node_modules", ".venv", ".novel"]
asyncio_mode = "auto"

